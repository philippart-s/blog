- title: 🎤 Talks donnés à Riviera Dev 🎤
  link: /talks/riviera-2026/
  description: Liste de talks donnés lors de la conférence Riviera Dev
  image: conferences/Riviera-Dev-2026.png
  author: wilda
  year: '2026'
