  - title: Au secours je suis speaker 😱 ! Comment bien se préparer ?
    id: speaker-workshop
    location: Rouen (🇫🇷)
    language: Français
    date: novembre 2022
    duration: 3 heures
    time: null
    pitch: |
      On aime toutes et tous aller aux conférences et on a toutes et tous nos chouchous en tant que speakers. Et on se dit même parfois que l’on aimerait bien aussi partager des choses, car oui on a toutes et tous quelque chose à partager.

      Mais voilà, passer de l’autre côté de la barrière peut être impressionnant. De l’idéation, en passant par la rédaction d’un CFP (Call For Paper / Appel à proposition), de ses slides, d’éventuellement ses démos jusqu’au fameux jour J. Sans oublier la gestion de l’après. Autant de sujets qui peuvent impressionner pour quelqu’un qui ne connaît pas les codes ou tout simplement se sent perdu et un peu effrayé.

      Durant ce talk / workshop nous vous livrerons, avec humilité, nos tips que nous avons collecté au fil des années avec nos erreurs et nos succès mais aussi les astuces que les autres speakers partagent volontiers.

      Ce sera, pour vous, l’occasion de piocher les tips qui vous permettront de vous améliorer ou de sauter le pas vers la grande aventure de donner un talk.
